description: >-
  Whether a user's prompt asks for closed verdicts over text, so the routing hook
  (decision 0018) should hint the agent towards the ask skill. The decision-model
  shadow of packages/core/src/route/route.ts, adopted in M11 to compare against the regex triggers.
questions:
  hint:
    type: noul
    instructions: >-
      The user's message asks the agent for closed verdicts over text that it would otherwise
      read and judge piece by piece: a label, yes/no or score for each of many items (tickets,
      reviews, commits, failures, log lines, rows, commands, files), the one best match out of a long list
      of candidates (packages, files, helpers, options), one verdict per rule or acceptance criterion over a diff, a log or test output,
      or a verdict on each step or command before an action that is hard to undo.
    criteria:
      true: The message asks for such verdicts, over a batch of items, a choice among many candidates, each rule or criterion held against evidence, or each step of something about to run.
      false: >-
        The message asks the agent to do something (write, fix, edit, run, commit, rename, explain,
        summarise), asks for an exact fact (a count, a list of matches, a date, whether a command succeeded),
        or asks one question about one small thing.
  batch-judgement:
    type: noul
    instructions: The message asks for a verdict, label or score on each of many items of text, or asks which of many items match a description.
    criteria:
      true: It names a batch (a file of tickets, reviews, commits, failures, rows or commands, or "every", "each", "all of") and asks for a judgement on each item.
      false: It asks about one item, asks for an exact list or count, or asks for no judgement at all.
  pick-from-many:
    type: noul
    instructions: The message asks for the single best match out of many candidates (packages, libraries, files, helpers, options) listed somewhere.
    criteria:
      true: There are many candidates and the user wants one of them picked.
      false: There are only a few options, or no pick is asked for.
  criteria-check:
    type: noul
    instructions: The message asks whether something meets a set of rules, criteria, requirements, a checklist, a policy or conventions.
    criteria:
      true: A rule set is named or listed, and the user wants to know whether the work, diff or output meets it.
      false: No rule set is involved, or the user asks to write or change the rules rather than check against them.
  done-check:
    type: noul
    instructions: The message asks whether a task or change is done, complete, or ready to merge, ship or commit, judged from evidence such as a diff, test output or a task file.
    criteria:
      true: The user asks for a verdict on whether the work is finished or ready.
      false: The user asks for work to be done, or asks a factual question such as whether a command succeeded.
  gate-check:
    type: noul
    instructions: Before an action that is hard to undo (commit, merge, push, deploy, release, running a script), the message asks whether it is safe, destructive or against the rules.
    criteria:
      true: An action is about to happen and the user wants a safety or rules verdict first.
      false: No such action is pending, or no verdict is asked for before it.
keep: ["hint>=0.7"]
policy:
  thresholds:
    hint:
      value: 0.7
      why: >-
        A wrong hint sends the agent to load a skill and hand a do-something request to decide,
        which costs tokens and can derail the turn; a missed hint only leaves the agent grading
        by itself, as it does without the hook. So a hint needs a confident yes. At or below 0.3
        the module says no hint; between the bars it keeps the regex's answer.
examples:
  - id: batch-yes
    state: "Go through alerts.jsonl and tell me which of the 120 alerts are false positives."
    expect: { hint: true, batch-judgement: true }
  - id: pick-yes
    state: "We have about 90 helper functions in src/util. Which single one should I use to retry a fetch with backoff?"
    expect: { hint: true, pick-from-many: true }
  - id: criteria-yes
    state: "Does my staged diff follow our logging conventions in CONTRIBUTING.md? One verdict per rule please."
    expect: { hint: true, criteria-check: true }
  - id: gate-yes
    state: "Before we deploy tonight, look at migrate.sh and tell me if any step could lose data."
    expect: { hint: true, gate-check: true }
  - id: do-no
    state: "Fix the failing test in src/billing/charge.test.ts and commit it."
    expect: { hint: false }
  - id: fact-no
    state: "List every file that changed on this branch since main."
    expect: { hint: false, batch-judgement: false }
  # The opt-out is an exact phrase, so the module vetoes it in code (route.ts's BUILTIN_IGNORE);
  # the model is asked only whether the prompt wants verdicts, which this one does.
  - id: opt-out-vetoed-in-code
    state: "Without using decide, read reviews.jsonl and label each review as positive or negative."
    expect: { hint: true }
  - id: done-near-miss
    state: "Is the PR description complete enough, or should I add a screenshot?"
