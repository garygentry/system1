# Stage a release on npm from a signed vX.Y.Z tag (decision 0022).
#
# Push the tag only; main follows once the release is live:
#   git push origin vX.Y.Z   →  this workflow stages all three packages
#   pnpm release:approve X.Y.Z   →  npm 2FA, per package; the version goes live
#   git push origin main
#
# npm trusts this file by name (trusted publishing, stage-only, environment
# npm-publish): renaming it breaks publishing. No npm token exists anywhere;
# the stage job's OIDC token is exchanged by npm itself, and a stage can't go
# live without a maintainer's 2FA. See docs/contributing/release.md.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that can fail, without any npm credential.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # checkout leaves a tag push's tag lightweight; the signature is on the annotated object.
      - name: Fetch the annotated tag
        run: git fetch --force --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node tools/release-verify.mjs "${GITHUB_REF_NAME}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm release:check

  # The only job that can reach npm, and only to stage.
  stage:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No registry-url and no NODE_AUTH_TOKEN: npm finds the OIDC token itself.
      # No cache: a restored cache is state this job didn't build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Trusted, stage-only publishing needs npm ≥ 11.15.0; pinned so a new npm can't change this job unseen.
      - run: npm install -g npm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: node tools/release-publish.mjs --stage --skip-check
