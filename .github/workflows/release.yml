# Publish a release to npm from a vX.Y.Z tag, after one approval
# (decision 0022, amended for ADR 0046 A4).
#
#   git push origin vX.Y.Z   →  verify runs, and writes the release summary
#   approve the `release` environment (GitHub web or Mobile)   →  publish runs
#   npm serves all three  →  git push origin main
#
# This is the only workflow that publishes. npm trusts it by file name and
# environment (trusted publishing, environment `release`): renaming it breaks
# publishing. No npm token exists anywhere; the publish job's OIDC token is
# exchanged by npm itself, and the job can't start until the environment's
# required reviewer approves it. See docs/contributing/release.md.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that can fail, without any npm credential.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # checkout leaves a tag push's tag lightweight; the message is on the annotated object.
      - name: Fetch the annotated tag
        run: git fetch --force --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node tools/release-verify.mjs "${GITHUB_REF_NAME}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm release:check
      # What the approver reads on the run page: packages, tag message, commits,
      # files, and a loud flag if .github/ changed since the last release.
      - run: node tools/release-summary.mjs "${GITHUB_REF_NAME}"

  # The only job that can reach npm. It waits for the `release` environment's
  # required reviewer, which no agent can satisfy.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No registry-url and no NODE_AUTH_TOKEN: npm finds the OIDC token itself.
      # No cache: a restored cache is state this job didn't build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Trusted publishing needs npm ≥ 11.5.1; pinned so a new npm can't change this job unseen.
      - run: npm install -g npm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: node tools/release-publish.mjs --provenance --skip-check
