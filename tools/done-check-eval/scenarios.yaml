        this.links.set(slug, {
          url,
          ...(ttlMs !== undefined ? { expiresAt: Date.now() + ttlMs } : {}),
        })
        return slug
      }

      /** The URL for a slug, or undefined. */
      get(slug: string): string | undefined {
        return this.links.get(slug)?.url
      }
    }
  store-expiry-no-delete: &store-expiry-no-delete |
    import { makeSlug } from "./slug.js"

    interface Link {
      url: string
      expiresAt?: number
    }

    /** Links in memory, by slug. */
    export class LinkStore {
      private links = new Map<string, Link>()

      /** Store a URL and return its slug. With `ttlMs`, the link expires that long from now. */
      put(url: string, ttlMs?: number): string {
        const slug = makeSlug(url)
        this.links.set(slug, {
          url,
          ...(ttlMs !== undefined ? { expiresAt: Date.now() + ttlMs } : {}),
        })
        return slug
      }

      /** The URL for a slug, or undefined when there is none or it has expired. */
      get(slug: string): string | undefined {
        const link = this.links.get(slug)
        if (!link) return undefined
        if (link.expiresAt !== undefined && Date.now() >= link.expiresAt) return undefined
        return link.url
      }
    }
  readme-expiry: &readme-expiry |
    # linkr

    A tiny URL shortener: `POST /` with a URL returns a short slug, and `GET /<slug>`
    redirects to it.

    ## Usage

    ```ts
    import { LinkStore } from "./src/store.js"

    const store = new LinkStore()
    const slug = store.put("https://example.com/a/long/path")
    store.get(slug) // "https://example.com/a/long/path"
    ```

    ## Expiring links

    Pass a time to live in milliseconds as the second argument to `put`. Once it has
    passed, `get` returns `undefined` and the link is removed:

    ```ts
    const slug = store.put("https://example.com/sale", 60 * 60 * 1000) // one hour
    ```
  test-expiry: &test-expiry |
    import { expect, it } from "vitest"
    import { LinkStore } from "../src/store.js"

    it("forgets a link once its ttl has passed", () => {
      let now = 1_000
      const store = new LinkStore(() => now)
      const slug = store.put("https://example.com", 500)
      expect(store.get(slug)).toBe("https://example.com")
      now = 1_500
      expect(store.get(slug)).toBeUndefined()
    })

  # The rename task.
  slug-renamed: &slug-renamed |
    import { createHash } from "node:crypto"

    /** A short, stable slug for a URL: the first 7 characters of its sha256, base64url. */
    export function slugFor(url: string): string {
      return createHash("sha256").update(url).digest("base64url").slice(0, 7)
    }
  store-renamed: &store-renamed |
    import { slugFor } from "./slug.js"

    /** Links in memory, by slug. */
    export class LinkStore {
      private links = new Map<string, string>()

      /** Store a URL and return its slug. */
      put(url: string): string {
        const slug = slugFor(url)
        this.links.set(slug, url)
        return slug
      }

      /** The URL for a slug, or undefined. */
      get(slug: string): string | undefined {
        return this.links.get(slug)
      }
    }
  test-renamed: &test-renamed |
    import { expect, it } from "vitest"
    import { slugFor } from "../src/slug.js"

    it("is stable and 7 characters long", () => {
      expect(slugFor("https://example.com")).toBe(slugFor("https://example.com"))
      expect(slugFor("https://example.com")).toHaveLength(7)
    })

  # The URL validation task.
  store-validated: &store-validated |
    import { makeSlug } from "./slug.js"

    /** Links in memory, by slug. */
    export class LinkStore {
      private links = new Map<string, string>()

      /** Store a URL and return its slug. Throws a TypeError unless it is http or https. */
      put(url: string): string {
        let parsed: URL
        try {
          parsed = new URL(url)
        } catch {
          throw new TypeError(`not a URL: ${url}`)
        }
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
          throw new TypeError(`only http and https links can be shortened: ${url}`)
        }
        const slug = makeSlug(url)
        this.links.set(slug, url)
        return slug
      }

      /** The URL for a slug, or undefined. */
      get(slug: string): string | undefined {
        return this.links.get(slug)
      }
    }
  server-validated: &server-validated |
    import { createServer } from "node:http"
    import { LinkStore } from "./store.js"

    const store = new LinkStore()

    export const server = createServer(async (req, res) => {
      if (req.method === "POST" && req.url === "/") {
        let body = ""
        for await (const chunk of req) body += chunk
        try {
          const slug = store.put(body.trim())
          res.writeHead(201, { "content-type": "text/plain" }).end(slug)
        } catch (error) {
          if (!(error instanceof TypeError)) throw error
          res.writeHead(400, { "content-type": "text/plain" }).end(error.message)
        }
        return
      }
      const url = store.get((req.url ?? "/").slice(1))
      if (!url) {
        res.writeHead(404).end()
        return
      }
      res.writeHead(302, { location: url }).end()
    })

  # The QR task: a new file.
  qr-done: &qr-done |
    /** An SVG QR-style badge for a short link: the slug's bits as a 7×7 grid of squares. */
    export function qrFor(slug: string): string {
      const bits = [...slug].flatMap((ch) => [...ch.charCodeAt(0).toString(2).padStart(7, "0")])
      const cells = bits
        .map((bit, i) => (bit === "1" ? `<rect x="${i % 7}" y="${Math.floor(i / 7)}" width="1" height="1"/>` : ""))
        .join("")
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 7">${cells}</svg>`
    }
  qr-stub: &qr-stub |
    /** An SVG QR-style badge for a short link. */
    export function qrFor(slug: string): string {
      // TODO: draw the grid
      throw new Error(`qrFor(${slug}) is not implemented yet`)
    }

