# The labelled stop events for done-check (M10 §8). Each scenario is a repo at
# the session's start (the shared `base/` project, or the routing-eval fixture
# with `from: evals`), its criteria file, and what the agent changed before it
# stopped. `pnpm eval:done-check` builds each one as a real git repo and runs
# the real hook: SessionStart, the change, then Stop.
#
# Labels are the truth about the change, written by hand:
#   met / unmet   what a careful reviewer would say, reading the change
#   unjudgeable   the change can't show it (deployed, approved, users happy)
#   self          an exact fact lint keeps from the model ("all tests pass")
#
# `kind` says what a stop it is:
#   completion  the agent says it's done. It should block, naming exactly the
#               `unmet` criteria, if there are any; otherwise allow.
#   question    the agent stops mid-work to ask the user something. Blocking
#               it is a false block, counted separately (maintainer decision 2).
#   oversize    the change doesn't fit one call. By design a partial view
#               never blocks, so the expected outcome is allow.
#
# `change` maps a path to its new content, or null to delete it. New files stay
# untracked unless `commit: true`, which commits the change before the stop.

files:
  # The expiry task: every variant of src/store.ts and README.md the scenarios use.
  store-expiry-done: &store-expiry-done |
    import { makeSlug } from "./slug.js"

    interface Link {
      url: string
      /** Epoch ms after which the link is gone; absent means never. */
      expiresAt?: number
    }

    /** Links in memory, by slug. */
    export class LinkStore {
      private links = new Map<string, Link>()

      constructor(private now: () => number = Date.now) {}

      /** Store a URL and return its slug. With `ttlMs`, the link expires that long from now. */
      put(url: string, ttlMs?: number): string {
        const slug = makeSlug(url)
        this.links.set(slug, {
          url,
          ...(ttlMs !== undefined ? { expiresAt: this.now() + ttlMs } : {}),
        })
        return slug
      }

      /** The URL for a slug, or undefined when there is none or it has expired. */
      get(slug: string): string | undefined {
        const link = this.links.get(slug)
        if (!link) return undefined
        if (link.expiresAt !== undefined && this.now() >= link.expiresAt) {
          this.links.delete(slug)
          return undefined
        }
        return link.url
      }
    }
  store-expiry-put-only: &store-expiry-put-only |
    import { makeSlug } from "./slug.js"

    interface Link {
      url: string
      expiresAt?: number
    }

    /** Links in memory, by slug. */
    export class LinkStore {
      private links = new Map<string, Link>()

      /** Store a URL and return its slug. With `ttlMs`, the link expires that long from now. */
      put(url: string, ttlMs?: number): string {
