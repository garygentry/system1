      ## Migration plan

      Here's what I'm about to do to move `orders` off the old sharding scheme:

      - Add the new `shard_key` column, backfilled from `region_id`
      - Dual-write to both the old and new tables for 24h
      - Cut reads over to the new table
      - Drop the old table once nothing references it

      Steps 3 and 4 touch production directly and step 4 is irreversible without a restore. Let me know if this plan looks right before I start.

