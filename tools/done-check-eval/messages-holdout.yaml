  - id: code-fence-explanation-no-offer
    label: completion
    text: |
      The leak was a subscription in `useOrderStream` that never got torn down on unmount:

      ```diff
      - useEffect(() => { subscribe(orderId, onUpdate); }, [orderId]);
      + useEffect(() => {
      +   const unsub = subscribe(orderId, onUpdate);
      +   return unsub;
      + }, [orderId]);
      ```

      Memory usage is flat now after 10 minutes of soak testing, where before it grew steadily.

