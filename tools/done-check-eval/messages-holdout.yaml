  - id: long-partial-work-approval
    label: question
    text: |
      I've finished the read path for the new `subscriptions` table — the API now serves subscription status from it and the response shapes match what the frontend expects. Feature-flagged behind `subs_v2`, so nothing user-facing has changed yet.

      The part I haven't touched is the write path, because it needs this migration to run first:

      ```sql
      ALTER TABLE users DROP COLUMN legacy_plan_id;
      ```

      Nothing in the current codebase reads `legacy_plan_id` anymore as far as I can tell, but it's a one-way door and I didn't want to guess. Want me to go ahead and drop it, or would you rather I keep it around for a while as a safety net?

