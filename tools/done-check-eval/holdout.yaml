  readme-clicks: &readme-clicks |
    # linkr

    A tiny URL shortener: `POST /` with a URL returns a short slug, and `GET /<slug>`
    redirects to it.

    ## Usage

    ```ts
    import { LinkStore } from "./src/store.js"

    const store = new LinkStore()
    const slug = store.put("https://example.com/a/long/path")
    store.get(slug) // "https://example.com/a/long/path"
    ```

    ## Click counts

    Every successful `get` counts as a click. `store.clicks(slug)` returns the count so far.
  server-no-store: &server-no-store |
    import { createServer } from "node:http"
    import { LinkStore } from "./store.js"

    const store = new LinkStore()

    export const server = createServer(async (req, res) => {
      if (req.method === "POST" && req.url === "/") {
        let body = ""
        for await (const chunk of req) body += chunk
        const slug = store.put(body.trim())
        res.writeHead(201, { "content-type": "text/plain" }).end(slug)
        return
      }
      const url = store.get((req.url ?? "/").slice(1))
      if (!url) {
        res.writeHead(404).end()
        return
      }
      // Never cached: a cached redirect would skip the click count.
      res.writeHead(302, { location: url, "cache-control": "no-store" }).end()
    })
  server-301: &server-301 |
