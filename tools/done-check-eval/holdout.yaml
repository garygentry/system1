# Holdout stop events for done-check (M10 §8). Written after the thresholds and
# the judgeable wording were fitted on scenarios.yaml, and before these were
# ever run, so their score is out of sample. Same format as scenarios.yaml.
# Don't tune on them: when a change is fitted against these, write a new holdout.

files:
  store-clicks-done: &store-clicks-done |
    import { makeSlug } from "./slug.js"

    /** Links in memory, by slug, with how often each was followed. */
    export class LinkStore {
      private links = new Map<string, string>()
      private counts = new Map<string, number>()

      /** Store a URL and return its slug. */
      put(url: string): string {
        const slug = makeSlug(url)
        this.links.set(slug, url)
        return slug
      }

      /** The URL for a slug, or undefined. A hit counts as a click. */
      get(slug: string): string | undefined {
        const url = this.links.get(slug)
        if (url !== undefined) this.counts.set(slug, (this.counts.get(slug) ?? 0) + 1)
        return url
      }

      /** How many times a slug has been followed. */
      clicks(slug: string): number {
        return this.counts.get(slug) ?? 0
      }
    }
