description: Screen source files for secrets written where they get copied and kept, such as logs, error messages and URLs.
questions:
  leaks_secret:
    type: noul
    instructions: This code writes a secret value (a password, API key, access token, private key or session cookie) into a log line, console output, an error or exception message, or a URL.
    criteria:
      true: A variable or field whose name or origin shows it holds a secret is interpolated, concatenated or passed into a log call, console output, an error message, or a URL or query string.
      false: Secrets are only sent in request headers or bodies, or are masked or redacted before being written, or the code handles no secrets at all.
keep: ["leaks_secret>=0.3"]
sort: leaks_secret:desc
policy:
  thresholds:
    leaks_secret:
      value: 0.3
      why: Screening. A leaked secret costs a rotation and an incident; a false keep costs a minute of reading. docs/calibration.md measured 88% precision and 97% recall at 0.3 on questions settled by reading the code. This one is settled only when names show what a value holds, so read what it keeps.
source: { glob: ["**/*.{ts,tsx,js,mjs,cjs,py}"], split: file }
meta:
  threshold_basis: calibration
examples:
  - id: logs-token
    state: |
      export async function login(user: string, password: string) {
        const { token } = await auth.signIn(user, password)
        logger.info(`signed in ${user} with token ${token}`)
        return token
      }
    expect: { leaks_secret: true }
  - id: key-in-query-string
    state: |
      const OPENWEATHER_API_KEY = process.env.OPENWEATHER_API_KEY
      export function forecastUrl(city: string) {
        return `https://api.openweather.test/data?q=${city}&appid=${OPENWEATHER_API_KEY}`
      }
    expect: { leaks_secret: true }
  - id: password-in-error
    state: |
      def connect(host, user, password):
          try:
              return db.connect(host=host, user=user, password=password)
          except db.Error as e:
              raise RuntimeError(f"could not connect as {user}:{password}@{host}: {e}")
    expect: { leaks_secret: true }
  - id: key-in-header
    state: |
      export function billingClient(apiKey: string) {
        return (path: string) =>
          fetch(`https://billing.test${path}`, { headers: { Authorization: `Bearer ${apiKey}` } })
      }
    expect: { leaks_secret: false }
  - id: redacted-before-logging
    state: |
      const redact = (s: string) => `${s.slice(0, 4)}…`
      export function logSession(sessionId: string, userId: string) {
        logger.debug({ user: userId, session: redact(sessionId) }, "session started")
      }
    expect: { leaks_secret: false }
  - id: near-miss-logs-non-secret-ids
    state: |
      export function audit(event: string, userId: string, requestId: string) {
        console.log(`[audit] ${event} user=${userId} request=${requestId}`)
      }
    expect: { leaks_secret: false }
  - id: borderline-whole-config-logged
    state: |
      export function start(config: AppConfig) {
        logger.info({ config }, "starting with config")
        return createServer(config)
      }
