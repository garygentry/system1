# Source of truth for everything `tools/generate.ts` emits.
# Change the version here and run `pnpm generate`; never edit generated manifests.
version: 0.4.1
owner:
  name: Gary Gentry
  email: gary@garygentry.net
repository: https://github.com/garygentry/system1
license: MIT
npm:
  scope: "@garygentry"
  cli: system1              # -> @garygentry/system1 (bin: decide)
  core: system1-core        # -> @garygentry/system1-core
  pi: system1-pi            # -> @garygentry/system1-pi (skills only, for `pi install npm:`)
marketplace:
  name: system1
plugin:
  name: system1
  displayName: System 1
  description: >-
    Route closed judgements (pick one, rate this, yes/no) to a decision model
    instead of reading everything yourself. Typed, calibrated answers in ~300 ms
    for a fraction of a cent, via the `decide` CLI.
  shortDescription: Cheap, typed decisions for coding agents
  category: Developer Tools
  keywords: [decisions, decision-model, jev, classification, triage, agents]
